<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>国庆旅游热度榜 · 查询工具</title>
  <meta name="description" content="2025 国庆实际人气 + 2026 国庆预测热度与机票紧张度查询榜单" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <div class="brand-mark">🏮</div>
        <div>
          <h1>国庆旅游热度榜 · 查询工具</h1>
          <p class="subtitle" id="subtitle">加载中…</p>
        </div>
      </div>
      <div class="search-box">
        <input id="search" type="search" placeholder="查城市 / 省份，例如：成都、新疆、县域…" autocomplete="off" />
        <button id="clearBtn" type="button" title="清空">✕</button>
      </div>
    </div>
  </header>

  <nav class="tabs wrap" id="tabs">
    <button class="tab active" data-tab="actual">📊 去年人气（2025）</button>
    <button class="tab" data-tab="predict">🔥 今年预测（2026）</button>
    <button class="tab" data-tab="ticket">✈️ 机票紧张度（2026）</button>
    <button class="tab" data-tab="county">🌿 县域 / 黑马（2026）</button>
  </nav>

  <main class="wrap" id="main">
    <!-- 各榜单由 app.js 渲染 -->
  </main>

  <footer class="site-footer wrap">
    <p id="disclaimer">数据说明加载中…</p>
    <p class="muted">数据来源：各地文旅局、携程、去哪儿、同程旅行、美团旅行、航旅纵横、中国旅游报等公开报道整理。非实时余票接口，机票以航司 / 售票平台实时查询为准。</p>
  </footer>

  <!-- 城市详情弹层 -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" type="button">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
